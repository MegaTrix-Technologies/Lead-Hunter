<?xml version="1.0" encoding="UTF-8"?>
<!--
  MEGATRIX — White Logo Variant (for Dark / Blue Backgrounds)
  ════════════════════════════════════════════════════════════
  Same pixel grid as megatrix-logo.svg, fill changed to #FFFFFF.
  Transparent background — drop onto any dark surface.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 240"
  shape-rendering="crispEdges"
  role="img"
  aria-label="MEGATRIX — Matrix Core System"
