    <rect x="121" y="11" width="8" height="8" fill="#FFFFFF"/>

    <!-- Row 2: ########.##... -->
    <rect x="1"   y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="11"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="21"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="31"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="41"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="51"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="21" width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="21" width="8" height="8" fill="#FFFFFF"/>
