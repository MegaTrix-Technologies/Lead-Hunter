    <rect x="31"  y="31" width="8" height="8" fill="#FFFFFF"/>
    <rect x="41"  y="31" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="31" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="31" width="8" height="8" fill="#FFFFFF"/>
