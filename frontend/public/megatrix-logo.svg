    <!-- Row 7: ##....##.##.## -->
    <rect x="1"   y="71" width="8" height="8" fill="#FFFFFF"/>
    <rect x="11"  y="71" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="71" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="71" width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="71" width="8" height="8" fill="#FFFFFF"/>
    <rect x="101" y="71" width="8" height="8" fill="#FFFFFF"/>
