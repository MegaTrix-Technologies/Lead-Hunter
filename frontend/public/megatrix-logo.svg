    <rect x="11"  y="51" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="51" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="51" width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="51" width="8" height="8" fill="#FFFFFF"/>
    <rect x="101" y="51" width="8" height="8" fill="#FFFFFF"/>

    <!-- Row 6: ##....##.##.## -->
    <rect x="1"   y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="11"  y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="101" y="61" width="8" height="8" fill="#FFFFFF"/>
    <rect x="121" y="61" width="8" height="8" fill="#FFFFFF"/>
