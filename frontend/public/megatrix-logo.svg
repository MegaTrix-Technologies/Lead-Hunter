<?xml version="1.0" encoding="UTF-8"?>
<!--
  MEGATRIX — Full SVG Logo (Icon + Wordmark)
  ══════════════════════════════════════════
  Color   : #FFFFFF (White) on transparent
  ViewBox : 0 0 180 130
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 180 130"
  shape-rendering="crispEdges"
  role="img"
  aria-label="MEGATRIX — Matrix Core System"
>
  <title>MEGATRIX</title>
  <desc>MEGATRIX pixel-art MT monogram with wordmark (White).</desc>

  <defs>
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('https://fonts.gstatic.com/s/pressstart2p/v16/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </defs>

  <!-- MT. Pixel Mark (centered at x=20, y=10, 140x80 grid) -->
  <g transform="translate(20, 10)">
    <!-- Row 0: ##....#######. -->
    <rect x="1"   y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="11"  y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="81"  y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="101" y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="111" y="1"  width="8" height="8" fill="#FFFFFF"/>
    <rect x="121" y="1"  width="8" height="8" fill="#FFFFFF"/>

    <!-- Row 1: ###..########. -->
    <rect x="1"   y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="11"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="21"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="51"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="61"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="71"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="81"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="91"  y="11" width="8" height="8" fill="#FFFFFF"/>
    <rect x="101" y="11" width="8" height="8" fill="#FFFFFF"/>
